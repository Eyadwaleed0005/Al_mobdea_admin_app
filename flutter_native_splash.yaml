flutter_native_splash:
  android: true
  ios: true
  web: false

  color: "#42000A"
  image: "assets/images/native_splash_logo.png"

  color_dark: "#42000A"
  image_dark: "assets/images/native_splash_logo.png"

  android_gravity: center
  ios_content_mode: center

  branding: "assets/images/fame_x_branding.png"
  branding_dark: "assets/images/fame_x_branding.png"
  branding_mode: bottom
  branding_bottom_padding: 24

  android_12:
    color: "#42000A"
    image: "assets/images/native_splash_logo_android12.png"

    color_dark: "#42000A"
    image_dark: "assets/images/native_splash_logo_android12.png"

    branding: "assets/images/fame_x_branding_android12.png"
    branding_dark: "assets/images/fame_x_branding_android12.png"